<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Arcade cabinet body -->
  <rect x="16" y="8" width="96" height="112" rx="6" fill="#1a1a2e"/>
  <rect x="18" y="10" width="92" height="108" rx="5" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Screen bezel -->
  <rect x="24" y="14" width="80" height="56" rx="4" fill="#0a0a12"/>
  <!-- Screen content — mini puzzle grid -->
  <rect x="30" y="20" width="68" height="44" rx="2" fill="#1f1c19"/>
  <!-- Mini blocks on screen -->
  <rect x="34" y="24" width="16" height="8" rx="2" fill="#d9a42e"/>
  <rect x="34" y="36" width="16" height="8" rx="2" fill="#c8302b"/>
  <rect x="54" y="24" width="8" height="16" rx="2" fill="#4879b8"/>
  <rect x="66" y="24" width="16" height="8" rx="2" fill="#7ea83a"/>
  <rect x="54" y="44" width="26" height="8" rx="2" fill="#a04db8"/>
  <rect x="66" y="36" width="8" height="16" rx="2" fill="#e07c3e"/>
  <!-- Exit glow -->
  <rect x="90" y="38" width="4" height="6" rx="1" fill="#c8302b" opacity="0.9"/>
  <!-- Marquee -->
  <rect x="28" y="74" width="72" height="16" rx="3" fill="#0ff" opacity="0.15"/>
  <text x="64" y="86" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#0ff" opacity="0.9">BRAIN ARCADE</text>
  <!-- Control panel -->
  <rect x="28" y="96" width="72" height="18" rx="3" fill="#111118"/>
  <!-- Joystick -->
  <circle cx="48" cy="105" r="5" fill="#222"/>
  <circle cx="48" cy="105" r="3" fill="#444"/>
  <!-- Buttons -->
  <circle cx="72" cy="102" r="4" fill="#d02820"/>
  <circle cx="84" cy="105" r="4" fill="#3a6dbf"/>
</svg>
