<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Dark board background -->
  <rect width="128" height="128" rx="16" fill="#1c1a18"/>
  <!-- Grid lines (subtle) -->
  <line x1="43" y1="12" x2="43" y2="116" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="85" y1="12" x2="85" y2="116" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="12" y1="43" x2="116" y2="43" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="12" y1="85" x2="116" y2="85" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Red target block (horizontal, spanning 2 cells in the middle row) -->
  <rect x="14" y="50" width="62" height="28" rx="6" fill="#c8302b" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>
  <!-- Highlight on red block -->
  <rect x="20" y="55" width="50" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>
  <!-- Other blocks (colored, smaller) -->
  <rect x="84" y="14" width="28" height="56" rx="5" fill="#4879b8" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
  <rect x="14" y="14" width="56" height="28" rx="5" fill="#d9a42e" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
  <rect x="14" y="86" width="28" height="28" rx="5" fill="#7ea83a" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
  <rect x="50" y="86" width="62" height="28" rx="5" fill="#a04db8" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
  <!-- Exit notch (right edge, middle row) -->
  <rect x="120" y="54" width="6" height="20" rx="2" fill="#c8302b" opacity="0.9"/>
</svg>
